<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KB GIS Meeting Note</title>
<meta name="description" content="글로벌상품영업부 LP·GP 미팅노트 DB (암호화)">
<meta name="robots" content="noindex, nofollow">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#60584C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#4A443B" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">

<!-- iOS 홈 화면 앱 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KB GIS Meeting Note">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="./app.css">
<script>
  // 화면 모드: 라이트(기본)·다크. 헤더 버튼으로 바꾸고 이 기기에 기억한다(설치 안내 페이지와 같은 값).
  // 그리기 전에 정해야 깜빡이지 않는다.
  (function () { var t = 'light'; try { t = localStorage.getItem('kbnote-theme') || 'light'; } catch (e) {} document.documentElement.dataset.theme = t; })();
</script>
</head>
<body>
<header class="band"><div class="band-in">
  <div class="brand">
    <div class="mark">KB</div>
    <div><div class="sub">글로벌상품영업부</div><h1>GIS Meeting Note</h1></div>
    <div class="grow"></div>
    <div class="hr">
      <div class="meta-r"><div class="stats" id="stats">불러오는 중…</div><div class="asof" id="asof"></div></div>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="다크 모드로" title="다크 모드로"><svg class="moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1z"/></svg><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5 7 7M17 17l1.5 1.5M5.5 18.5 7 17M17 7l1.5-1.5"/></svg></button>
      <button class="iconbtn lockbtn" id="lockBtn" type="button" aria-label="잠그기 (이 기기에서 비밀번호 지우기)" title="잠그기"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="보기">
    <button class="tab" role="tab" data-tab="meetings" aria-selected="true">미팅노트</button>
    <button class="tab" role="tab" data-tab="orgs" aria-selected="false">기관</button>
    <button class="tab" role="tab" data-tab="demand" aria-selected="false">전략 수요판</button>
    <button class="tab" role="tab" data-tab="people" aria-selected="false">인물·조직도</button>
  </nav>
</div></header>

<div class="page">
  <!-- 미팅노트 -->
  <section id="p-meetings" class="split">
    <aside class="side">
      <div class="filters" id="mFilters">
        <input id="mq" class="full" type="search" placeholder="기관·인물·내용·GP 검색">
        <select id="mCat" class="opt"><option value="">구분 전체</option><option>LP</option><option>GP</option><option>시장정보</option><option>내부</option></select>
        <select id="mType" class="opt"><option value="">업권 전체</option></select>
        <select id="mAsset" class="opt"><option value="">전략 전체</option></select>
        <select id="mAuthor" class="opt"><option value="">작성자 전체</option></select>
        <select id="mFlag" class="full opt"><option value="">표시 전체</option><option value="원문 잘림">원문 잘림(보완 필요)</option><option value="내부용">내부용</option><option value="확인">이름·날짜 확인 필요</option></select>
      </div>
      <div class="quick"><button class="qbtn" id="mCut" type="button" aria-pressed="false">✂ 원문 잘림 <span id="mCutN"></span>건</button><button class="qbtn ftog" id="mFt" type="button">필터</button></div>
      <div class="count"><span id="mCnt">불러오는 중…</span><button class="btn sm primary" id="mNew" type="button">+ 미팅 추가</button></div>
      <div class="list" id="mList"><div class="empty">미팅노트를 불러오는 중입니다.</div></div>
    </aside>
    <main class="main" id="mMain"><div class="empty">왼쪽에서 미팅을 선택하세요.</div></main>
  </section>

  <!-- 기관 -->
  <section id="p-orgs" class="split" hidden>
    <aside class="side">
      <div class="filters">
        <input id="oq" class="full" type="search" placeholder="기관명·약칭 검색">
        <select id="oType" class="full"><option value="">업권 전체</option></select>
      </div>
      <div class="count"><span id="oCnt"></span><button class="btn sm" id="oNew" type="button">+ 기관 추가</button></div>
      <div class="list" id="oList"></div>
    </aside>
    <main class="main" id="oMain"><div class="empty">왼쪽에서 기관을 선택하세요.</div></main>
  </section>

  <!-- 전략 수요판 -->
  <section id="p-demand" hidden>
    <div class="toolbar">
      <select id="dStrat" aria-label="전략"><option value="">전체 매트릭스</option></select>
      <select id="dType" aria-label="업권"><option value="">업권 전체</option></select>
      <input id="dq" type="search" placeholder="기관 검색">
    </div>
    <div class="legend" id="legend" style="margin-bottom:10px"></div>
    <div id="dBody"></div>
    <p class="basis" style="margin-top:10px">시그널은 미팅노트 최신 발언을 기준으로 정리한 추정치입니다. 기관 탭에서 수정하면 바로 반영됩니다. 셀을 누르면 근거와 날짜가 보입니다.</p>
  </section>

  <!-- 인물·조직도 -->
  <section id="p-people" class="split" hidden>
    <aside class="side">
      <div class="filters">
        <input id="pq" class="full" type="search" placeholder="이름·기관·메모 검색">
        <select id="pOrg" class="full"><option value="">기관 전체</option></select>
      </div>
      <div class="count"><span id="pCnt"></span><button class="btn sm" id="pNew" type="button">+ 인물 추가</button></div>
      <div class="list" id="pList"></div>
    </aside>
    <main class="main" id="pMain"><div class="empty">기관을 고르면 조직도가, 인물을 고르면 상세가 보입니다.</div></main>
  </section>

</div>
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="mark">KB</div>
    <div class="sub">글로벌상품영업부</div>
    <h2>KB GIS Meeting Note</h2>
    <p>암호화된 미팅노트 DB입니다. 비밀번호를 넣으면 이 기기에서만 풀어서 보여줍니다.</p>
    <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required>
    <label class="remember"><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
    <button class="btn primary" id="unlock" type="submit">열기</button>
    <p class="gate-msg" id="gateMsg" role="alert" aria-live="polite"></p>
    <div class="gate-asof" id="gateAsof"></div>
  </form>
</div>
<button class="fab" id="fab" type="button" aria-label="미팅 추가" hidden>+</button>
<nav class="bnav" aria-label="보기">
  <button type="button" data-tab="meetings" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"/></svg>미팅</button>
  <button type="button" data-tab="orgs" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14M9 21v-5h6v5M8 10h.01M12 10h.01M16 10h.01"/></svg>기관</button>
  <button type="button" data-tab="demand" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>수요판</button>
  <button type="button" data-tab="people" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>인물</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="./vault.js"></script>
<script src="./app.js"></script>
<script>
  // 서비스워커: 오프라인에서도 열리고(마지막으로 받은 암호화 DB), 새 배포는 다음 실행 때 자동 반영.
  if ('serviceWorker' in navigator) {
    var refreshing = false, hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing || !hadController) return;   // 첫 설치 때는 새로고침하지 않음(비밀번호 입력 중일 수 있음)
      refreshing = true;
      window.location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(function (reg) { reg.update(); setInterval(function () { reg.update(); }, 60 * 60 * 1000); })
        .catch(function (e) { console.warn('SW registration failed', e); });
    });
  }
</script>
</body>
</html>
